name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm compile

      # Before the tests: the MCP suite drives the published entry point, so
      # it needs the bundle that entry point loads.
      - run: pnpm build:cli

      - run: pnpm test

      - run: pnpm lint

      - run: pnpm build

      # The package a user installs has to be installable. `npm pack` runs
      # prepack, so this also proves the bundle is in the tarball.
      - run: npm pack --dry-run
