name: Release

# Cutting a release is `git tag v2.3.0 && git push --tags`. Everything below —
# gates, build, notes, upload — happens here so a release can never be a
# hand-built zip from someone's laptop.
on:
  push:
    tags:
      - 'v*'

# One release run at a time for a tag.
#
# GitHub delivered the v2.23.0 tag push twice, five seconds apart, and the two
# runs raced: one created the release while the other took the "already exists"
# branch, and the retire step below deletes every release that is not this tag
# — so one run can delete what the other has just made. The end state was right
# that time by luck.
#
# Queued rather than cancelled. `cancel-in-progress` would stop a run halfway
# through uploading a zip, and a release page with a half-finished asset on it
# is worse than one that took another minute.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # What npm's trusted publishing runs on: GitHub mints a short-lived OIDC
  # token for this workflow, npm checks it against the publisher rule on the
  # package, and no long-lived secret is involved at all. It is also what makes
  # the provenance attestation possible, so anyone can verify the published
  # tarball was built from this tag in this repository.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10.
      # Without this the publish fails on an npm that has never heard of OIDC.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json publishes a zip whose manifest
      # version contradicts the release page it hangs on. Catch it before the
      # build rather than after the upload.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi

      # Same gates as CI. A tagged build is the one that most needs them.
      - run: pnpm compile
      - run: pnpm build:cli
      - run: pnpm test
      - run: pnpm lint

      - run: pnpm zip

      # Fails when CHANGELOG.md has no section for this tag, which is the right
      # outcome: a release page is the first thing a stranger reads.
      - name: Extract the changelog section for this tag
        run: pnpm release:notes "${GITHUB_REF_NAME}" > release-notes.md

      # Idempotent, because a run that fails after this point can only be
      # retried by re-running the job — and the job starts here. v2.17.0 was
      # published to GitHub, failed at npm, and then could not be retried at
      # all: every attempt died on "a release with the same tag name already
      # exists" before reaching the step that had actually failed.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=".output/openread-${GITHUB_REF_NAME#v}-chrome.zip"
          # The numeric id, not `gh release view --json id`, which answers with
          # the GraphQL node id that the REST endpoint below will not take.
          id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq .id 2>/dev/null || true)
          if [ -n "${id}" ]; then
            # Not `gh release edit`. That sends `tag_name` back with the patch,
            # and GitHub answers 422 "Release.tag_name already exists" — about a
            # tag which is, of course, this release's own. This branch had never
            # run until a duplicated tag push made it run, and it failed the
            # first time it did. Patching only the two fields that are meant to
            # change avoids the argument entirely.
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${id}" \
              -f name="OpenRead ${GITHUB_REF_NAME}" \
              -F body=@release-notes.md > /dev/null
            gh release upload "${GITHUB_REF_NAME}" "${zip}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "OpenRead ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              "${zip}"
          fi

      # One release on the page, and it is always the newest.
      #
      # Thirty-three releases accumulated in three days, and every one before
      # the latest has a bug the latest fixes — that is what the patches were.
      # An old zip left on the releases page is a working download of a build
      # already known to be broken, which is worse than no download at all.
      #
      # The tags stay. They are what the CHANGELOG sections point at and what
      # `git describe` reads, and they cost nothing on the releases page —
      # `--cleanup-tag` is deliberately not passed.
      #
      # Ordered after the create above, and gated on that release actually
      # existing, so the page can never end up empty.
      - name: Retire the previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" > /dev/null
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -vxF "${GITHUB_REF_NAME}" \
            | while read -r old; do
                echo "Deleting release ${old} (tag kept)"
                gh release delete "${old}" --yes
              done

      # No token, and no `--provenance` flag either: publishing through trusted
      # publishing attaches the attestation on its own. The package must carry a
      # publisher rule naming this repository and this workflow file — set on
      # npmjs.com under the package's settings — or npm refuses the OIDC token
      # and this step fails loudly, which is the right way for it to fail.
      #
      # What it replaces: a long-lived `NPM_TOKEN` secret, and a run that died
      # with `IDENTITY_TOKEN_READ_ERROR` while holding one.
      #
      # The GitHub release above does not depend on this step. The extension
      # zip is not on npm; `npx openread` is.
      - name: Publish to npm
        run: npm publish --access public
