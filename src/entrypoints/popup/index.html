<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenRead</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: #fff;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1e1e;
          color: #eee;
        }
        input,
        select,
        textarea {
          background: #2a2a2a;
          color: #eee;
          border-color: #444;
        }
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-size: 12px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        font-size: 13px;
        /* #ccc was 1.61:1 against white — below the 3:1 a control border needs */
        border: 1px solid #8b93a1;
        border-radius: 6px;
      }
      textarea {
        /* Monospace because the grammar is column-aligned: the reader is
           scanning for the `=` that separates a term from what it becomes. */
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        resize: vertical;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 9px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        /* 14px bold is not "large text", so the label needs the full 4.5:1;
           #3b82f6 gave 3.68 */
        background: #2563eb;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      #status {
        margin-top: 10px;
        height: 16px;
        font-size: 12px;
        /* one green cannot serve both themes: 5.02 here, 5.06 on the dark body */
        color: #15803d;
        text-align: center;
      }
      #status.error {
        color: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        #status {
          color: #16a34a;
        }
        #status.error {
          color: #f87171;
        }
      }
      hr {
        margin: 16px 0 4px;
        border: 0;
        border-top: 1px solid #ddd;
      }
      @media (prefers-color-scheme: dark) {
        hr {
          border-top-color: #444;
        }
      }
      label.checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        font-weight: 400;
        cursor: pointer;
      }
      label.checkbox input {
        width: auto;
      }
      #engineNote {
        margin: 6px 0 0;
        font-size: 11px;
        line-height: 1.45;
        color: #4b5563;
      }
      @media (prefers-color-scheme: dark) {
        #engineNote {
          color: #9ca3af;
        }
      }
      #enrichOnly[hidden],
      #siteExceptRow[hidden],
      #pack[hidden],
      #downloadPack[hidden],
      #ollamaOnly[hidden] {
        display: none;
      }
      #packNote {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.45;
        color: #4b5563;
      }
      #packNote.ready {
        color: #15803d;
      }
      #packNote.warn {
        color: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        #packNote {
          color: #9ca3af;
        }
        #packNote.ready {
          color: #16a34a;
        }
        #packNote.warn {
          color: #fbbf24;
        }
      }
      #downloadPack {
        margin-top: 8px;
        padding: 6px 10px;
        font-size: 12px;
      }
      #autoNote,
      .hint {
        margin: 6px 0 0;
        font-size: 11px;
        line-height: 1.45;
        color: #4b5563;
      }
      .hint {
        margin: 0 0 6px;
      }
      .hint code {
        font-size: 11px;
        /* Only just visible against the popup, on purpose: these are examples
           of a format, not controls. */
        background: #f1f3f5;
        border-radius: 3px;
        padding: 0 3px;
      }
      @media (prefers-color-scheme: dark) {
        #autoNote,
        .hint {
          color: #9ca3af;
        }
        .hint code {
          background: #333;
        }
      }
      /* The connection line sits under the URL field it reports on, so it reads
         as that field's state rather than as a second status area. */
      #connection {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.4;
        color: #4b5563;
      }
      #connection.ok {
        color: #15803d;
      }
      #connection.warn {
        color: #b45309;
      }
      #connection.error {
        color: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        #connection {
          color: #9ca3af;
        }
        #connection.ok {
          color: #16a34a;
        }
        #connection.warn {
          color: #fbbf24;
        }
        #connection.error {
          color: #f87171;
        }
      }
      #fix {
        display: flex;
        gap: 6px;
        align-items: stretch;
        margin-top: 6px;
      }
      #fix[hidden] {
        display: none;
      }
      #fixCommand {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        padding: 6px 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        white-space: pre;
        background: #f3f4f6;
        border: 1px solid #8b93a1;
        border-radius: 6px;
      }
      @media (prefers-color-scheme: dark) {
        #fixCommand {
          background: #2a2a2a;
          border-color: #444;
        }
      }
      .primary-action {
        margin-top: 0;
        margin-bottom: 4px;
      }
      #copyFix {
        flex: 0 0 auto;
        width: auto;
        margin-top: 0;
        padding: 6px 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>OpenRead</h1>
    <!-- The primary action, above the settings it depends on: the popup is
         opened far more often to translate a page than to change a model. -->
    <button id="translatePage" type="button" class="primary-action">
      Translate this page
    </button>
    <form id="settingsForm">
      <label for="engine">Translator</label>
      <select id="engine">
        <option value="builtin">Chrome built-in — no setup</option>
        <option value="ollama">Ollama — local LLM</option>
      </select>
      <p id="engineNote"></p>

      <!-- Every Ollama-only control lives here, so choosing the built-in
           engine hides a server URL, a model name and a connection check that
           would otherwise ask a user to configure something they do not have. -->
      <div id="ollamaOnly">
        <label for="baseUrl">Ollama Server URL</label>
        <input id="baseUrl" type="text" placeholder="http://localhost:11434" />
        <!-- Announced, because the whole reason this line exists is to reach a
           user who would otherwise learn about a 403 from a failed
           translation. -->
        <div id="connection" role="status" aria-live="polite">Checking…</div>
        <div id="fix" hidden>
          <code id="fixCommand"></code>
          <!-- type="button": inside a form, the default is submit -->
          <button id="copyFix" type="button">Copy</button>
        </div>

        <label for="modelId">Model</label>
        <!-- A list, not a select: the options come from a server that may be
           unreachable, and a user must still be able to save a model name when
           it is. The list offers what is installed; the field accepts anything
           and warns when it is not there. -->
        <input
          id="modelId"
          type="text"
          list="modelOptions"
          placeholder="qwen3:latest"
        />
        <datalist id="modelOptions"></datalist>
      </div>

      <label for="targetLang">Target Language</label>
      <select id="targetLang"></select>
      <!-- Chrome downloads a model per language pair, once per profile, and it
           takes 30 s to two minutes. Met on a first press it is
           indistinguishable from the extension being broken, so it is said here
           instead — where the wait can be got out of the way while nobody is
           waiting for a translation. -->
      <div id="pack" hidden>
        <div id="packNote" role="status" aria-live="polite"></div>
        <button id="downloadPack" type="button">Download it now</button>
      </div>

      <!-- Off by default. The one thing worse than a translator that has to be
           asked is one that rewrites a page the reader could already read. -->
      <label for="autoTranslate">Translate automatically</label>
      <select id="autoTranslate">
        <option value="off">Off — only when I ask</option>
        <option value="foreign">Pages in another language</option>
        <option value="always">Every page</option>
      </select>
      <p id="autoNote"></p>
      <label class="checkbox" id="siteExceptRow" hidden>
        <input id="siteExcept" type="checkbox" />
        <span id="siteExceptLabel">Never on this site</span>
      </label>

      <hr />

      <label for="displayMode">Show</label>
      <select id="displayMode">
        <option value="bilingual">Original and translation</option>
        <option value="translationOnly">Translation only</option>
      </select>

      <label for="translationStyle">Translation style</label>
      <select id="translationStyle">
        <option value="line">Line down the side</option>
        <option value="plain">No marking</option>
        <option value="dashed">Dashed underline</option>
        <option value="highlight">Tinted background</option>
      </select>

      <!-- The other direction. `targetLang` is what you read in; nobody
           writes a reply to an English forum in the language they read English
           into. -->
      <label for="inputTargetLang">Write into (Ctrl+Shift+K)</label>
      <select id="inputTargetLang"></select>

      <label for="hoverTranslate">Translate one paragraph</label>
      <select id="hoverTranslate">
        <option value="alt">Hold Alt and point at it</option>
        <option value="ctrl">Hold Ctrl and point at it</option>
        <option value="shift">Hold Shift and point at it</option>
        <option value="off">Off</option>
      </select>

      <label for="translationScale">Translation size</label>
      <select id="translationScale">
        <option value="small">Smaller than the original</option>
        <option value="same">Same as the original</option>
        <option value="large">Larger than the original</option>
      </select>

      <!-- Off by default: it changes what a video looks like while it plays. -->
      <label class="checkbox">
        <input id="translateSubtitles" type="checkbox" />
        Translate subtitles while a video plays
      </label>

      <hr />

      <!-- Names a translator gets wrong and no prompt can fix, because the
           built-in engine takes no prompt. See core/glossary.ts. -->
      <label for="glossary">Never translate these</label>
      <p class="hint">
        One a line. <code>OpenRead</code> keeps it as written;
        <code>bug = 瑕疵</code> pins how it is translated.
      </p>
      <textarea
        id="glossary"
        rows="4"
        spellcheck="false"
        placeholder="OpenRead&#10;React Native&#10;bug = 瑕疵"
      ></textarea>

      <hr />

      <label for="obsidianVault">Obsidian Vault (optional)</label>
      <input id="obsidianVault" type="text" placeholder="Default vault" />

      <label for="obsidianFolder">Capture Folder</label>
      <input id="obsidianFolder" type="text" placeholder="OpenRead" />

      <!-- Enrichment is an Ollama feature: it asks a local model for a title,
           a summary and tags. Offering it under the built-in engine promised
           something that could only fail, quietly, into a plain capture. -->
      <label class="checkbox" id="enrichOnly">
        <input id="enrichOnCapture" type="checkbox" />
        Enrich captures with the local model
      </label>

      <button id="saveBtn" type="submit">Save</button>
      <!-- the only feedback this popup gives; without a live region a screen
           reader never hears it appear and vanish -->
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <script src="./main.ts" type="module"></script>
  </body>
</html>
