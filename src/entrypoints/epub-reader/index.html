<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenRead</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #fdfdfc;
        --ink: #1a1a1a;
        --muted: #5a6270;
        --rule: #d9d9d6;
        --bar: #f4f4f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1a1b1e;
          --ink: #e8e6e3;
          --muted: #a3a8b3;
          --rule: #383a40;
          --bar: #232529;
        }
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', 'Noto Serif TC', serif;
        /* A book is read, not scanned. Larger and looser than a web page. */
        font-size: 19px;
        line-height: 1.7;
      }
      button {
        font: inherit;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
        color: inherit;
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--rule);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      /* The toolbar stays put, because the way out of a chapter should not be
         at the end of it. Sticky rather than fixed so it takes part in layout
         and the chapter is never hidden underneath it. */
      #oit-epub-bar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 14px;
        background: var(--bar);
        border-bottom: 1px solid var(--rule);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
      }
      #oit-epub-title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 30ch;
      }
      #oit-epub-where {
        color: var(--muted);
        white-space: nowrap;
      }
      .oit-epub-spacer {
        flex: 1;
      }

      #oit-epub-toc {
        position: sticky;
        top: 41px;
        z-index: 1;
        max-height: 60vh;
        overflow-y: auto;
        padding: 10px 14px;
        background: var(--bar);
        border-bottom: 1px solid var(--rule);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
      }
      #oit-epub-toc ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #oit-epub-toc li {
        margin: 1px 0;
      }
      #oit-epub-toc li[data-depth='1'] {
        padding-left: 18px;
      }
      #oit-epub-toc li[data-depth='2'] {
        padding-left: 36px;
      }
      #oit-epub-toc li[data-depth='3'] {
        padding-left: 54px;
      }
      #oit-epub-toc button {
        border: 0;
        border-radius: 4px;
        padding: 3px 6px;
        text-align: left;
        width: 100%;
      }
      #oit-epub-toc button[aria-current='true'] {
        font-weight: 700;
        background: var(--rule);
      }
      #oit-epub-toc span {
        display: block;
        padding: 3px 6px;
        color: var(--muted);
        font-weight: 600;
      }

      /* The chapter. `main` is not decoration: `ui/blocks.ts` scopes a page to
         it, so putting the chapter here and the toolbar outside is what keeps
         whole-page translation off the reader's own controls. */
      #oit-epub-content {
        max-width: 38em;
        margin: 0 auto;
        padding: 32px 24px 96px;
      }
      #oit-epub-content img,
      #oit-epub-content svg {
        max-width: 100%;
        height: auto;
      }
      #oit-epub-content h1,
      #oit-epub-content h2,
      #oit-epub-content h3 {
        line-height: 1.3;
      }
      #oit-epub-content a {
        color: inherit;
      }
      #oit-epub-content blockquote {
        margin-inline: 0;
        padding-inline-start: 1em;
        border-inline-start: 3px solid var(--rule);
      }

      #oit-epub-welcome {
        max-width: 32em;
        margin: 12vh auto;
        padding: 0 24px;
        text-align: center;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 15px;
      }
      #oit-epub-welcome h1 {
        font-size: 22px;
      }
      #oit-epub-welcome p {
        color: var(--muted);
        line-height: 1.6;
      }
      #oit-epub-choose {
        font-size: 15px;
        padding: 10px 18px;
      }
      /* The real control, kept out of sight: a file input styles badly and
         reads worse, and the button above forwards the click to it. */
      #oit-epub-file {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      #oit-epub-error {
        margin: 16px auto;
        max-width: 38em;
        padding: 10px 14px;
        border: 1px solid #b3261e;
        border-radius: 6px;
        color: #b3261e;
        background: #b3261e14;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
        text-align: left;
      }
      /* Dragging a book onto the window. */
      body.oit-epub-dropping::after {
        content: '';
        position: fixed;
        inset: 8px;
        border: 3px dashed var(--muted);
        border-radius: 12px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="oit-epub-shell" hidden>
      <div id="oit-epub-bar">
        <button
          id="oit-epub-toc-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="oit-epub-toc"
        >
          Contents
        </button>
        <span id="oit-epub-title"></span>
        <span class="oit-epub-spacer"></span>
        <span id="oit-epub-where"></span>
        <button id="oit-epub-previous" type="button">‹ Previous</button>
        <button id="oit-epub-next" type="button">Next ›</button>
        <button id="oit-epub-translate" type="button">Translate</button>
      </div>
      <nav id="oit-epub-toc" hidden aria-label="Contents"></nav>
      <main id="oit-epub-content"></main>
    </div>

    <div id="oit-epub-welcome">
      <h1>Open a book</h1>
      <p>
        An EPUB opens here and stays here — nothing about it is uploaded, and no
        part of it is fetched from anywhere. Translate a chapter with the button
        in the toolbar, or select any passage and press
        <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Y</kbd>.
      </p>
      <p>You can also drop an <code>.epub</code> file anywhere on this page.</p>
      <button id="oit-epub-choose" type="button">Choose an EPUB</button>
      <input
        id="oit-epub-file"
        type="file"
        accept=".epub,application/epub+zip"
      />
    </div>

    <p id="oit-epub-error" role="alert" hidden></p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
